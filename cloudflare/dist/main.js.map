export default "<div class=\"blog-previews\">\n  <div class=\"blog-previews__wrapper\">\n    <div class=\"preview\" *ngFor=\"let preview of previews\">\n      <a routerLink=\"/blog/{{ preview.slug }}\">\n        <div\n          class=\"preview__image\"\n          [ngStyle]=\"{ 'background-image': 'url(' + preview.url + ')' }\"\n        ></div>\n      </a>\n      <div class=\"preview__info\">\n        <span class=\"preview__title\">{{ preview.title }}</span>\n        <span class=\"preview__type\">{{ preview.type }}</span>\n        <!-- Add type to Contenful -->\n        <button class=\"preview__cta\">\n          <a routerLink=\"/blog/{{ preview.slug }}\">View More</a>\n        </button>\n      </div>\n    </div>\n  </div>\n</div>\n"
