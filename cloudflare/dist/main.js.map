export default "<div class=\"hero-carousel__wrapper\">\n  <div class=\"hero-carousel\">\n    <ul class=\"slides\">\n      <ng-container *ngIf=\"slides !== undefined\">\n        <li\n          class=\"slide\"\n          *ngFor=\"let slide of slides\"\n          [ngStyle]=\"{ 'background-image': 'url(' + slide + ')' }\"\n        ></li>\n      </ng-container>\n    </ul>\n  </div>\n  <ep-photography-scroll-down></ep-photography-scroll-down>\n</div>\n"
