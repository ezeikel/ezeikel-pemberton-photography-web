export default "<ng-container *ngIf=\"post\">\n  <div class=\"post\">\n    <h2 class=\"post__title\">{{ post.title }}</h2>\n    <div class=\"post__images\">\n      <div\n        *ngFor=\"let image of post.images\"\n        class=\"post__image\"\n        [ngStyle]=\"{ 'background-image': 'url(' + image + ')' }\"\n      ></div>\n    </div>\n  </div>\n</ng-container>\n"
