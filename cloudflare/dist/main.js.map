export default "<header class=\"header\">\n<nav class=\"header__nav\" [ngClass]=\"{'is-active': mobileNavActive}\">\n    <div class=\"header__logo-wrapper\">\n      <a class=\"header__logo-link\" routerLink=\"/\">\n        <ep-photography-logo [ngClass]=\"{'is-active': mobileNavActive}\"></ep-photography-logo>\n      </a>\n    </div>\n    <ul class=\"header__menu\">\n      <li class=\"menu-item\">\n        <a routerLink=\"/\" (click)=\"handleClick()\">Home</a>\n      </li>\n      <li class=\"menu-item\">\n        <a routerLink=\"/blog\" (click)=\"handleClick()\">Blog</a>\n      </li>\n    </ul>\n    <ul class=\"header__menu\">\n      <li class=\"menu-item\">\n        <a href=\"http://clients.ezeikelpemberton.com\" (click)=\"handleClick()\">Clients</a>\n      </li>\n      <li class=\"menu-item\">\n        <a [routerLink]=\"['/home']\" fragment=\"contact\" (click)=\"handleClick()\">Get in touch</a>\n      </li>\n    </ul>\n  </nav>\n  <ep-photography-hamburger></ep-photography-hamburger>\n</header>"
