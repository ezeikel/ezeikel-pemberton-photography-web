export default "<div class=\"latest-updates\">\n  <h2 class=\"latest-updates__title\">Latest Updates</h2>\n  <div class=\"latest-updates__wrapper\">\n    <div class=\"preview\" *ngFor=\"let preview of previews\">\n      <a routerLink=\"/blog/{{ preview.slug }}\">\n        <div\n          class=\"preview__image\"\n          [ngStyle]=\"{ 'background-image': 'url(' + preview.url + ')' }\"\n        ></div>\n      </a>\n      <span class=\"preview__info\">{{ preview.title }}</span>\n    </div>\n  </div>\n</div>\n"
