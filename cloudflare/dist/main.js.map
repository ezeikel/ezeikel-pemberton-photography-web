export default "<section class=\"details\">\n  <h2 class=\"details__title\">Addicted to the details</h2>\n  <div class=\"details__items-wrapper\">\n    <div\n      class=\"details__item\"\n      *ngFor=\"let detail of details; let i = index\"\n      [ngClass]=\"{ alternate: i % 2 !== 0 }\"\n    >\n      <div class=\"item__copy\">\n        {{ detail.copy }}\n        <button *ngIf=\"detail.cta\" class=\"item__cta\">\n          <a [routerLink]=\"['/home']\" fragment=\"contact\">Get in touch</a>\n        </button>\n      </div>\n      <div\n        class=\"item__image\"\n        [style.backgroundImage]=\"'url(' + detail.imageUrl + ')'\"\n      ></div>\n    </div>\n  </div>\n</section>\n"
